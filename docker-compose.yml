services:
  db:
    image: postgres:16-alpine
    container_name: helpmetravel_postgres
    restart: always
    environment:
      POSTGRES_USER: hmt_user
      POSTGRES_PASSWORD: hmt_password
      POSTGRES_DB: helpmetravel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmt_user -d helpmetravel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: helpmetravel_backend
      restart: always
      environment:
        - DATABASE_URL=postgresql+asyncpg://hmt_user:hmt_password@db:5432/helpmetravel_db
        - SECRET_KEY=secretjwtkey
        - ALGORITHM=HS256
        - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      ports:
        - "8000:8000"
      depends_on:
        db:
          condition: service_healthy
      volumes:
        - ./app:/app/app

volumes:
  postgres_data: